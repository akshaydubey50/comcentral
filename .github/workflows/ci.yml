name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      integration-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme_integration_test
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/acme_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/acme_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/acme_integration_test
      SEED_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/comcentral_seed_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-auth-secret-never-use-outside-disposable-tests
      CRON_SECRET: ci-only-cron-secret-never-use-outside-disposable-tests
      HR_EMAIL: hr@example.test
      HR_NAME: Test HR Manager
      HR_PASSWORD: ci-only-password-7F9m3J2k
      E2E_EMAIL: hr@example.test
      E2E_ALLOW_REGISTRATION: 'true'
      E2E_PASSWORD: ci-only-password-7F9m3J2k
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run test:benchmark
      - run: npm run typecheck
      - run: npm run lint
      - name: Migrate isolated integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/acme_integration_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5433/acme_integration_test
      - name: Create dedicated seed integration database
        run: psql --host localhost --port 5433 --username postgres --dbname postgres --command 'CREATE DATABASE comcentral_seed_test'
        env:
          PGPASSWORD: postgres
      - name: Migrate dedicated seed integration database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/comcentral_seed_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5433/comcentral_seed_test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run test:production
      - run: npm run db:provision
      - run: npm run db:seed
        env:
          COMCENTRAL_SEED_TARGET: test
          COMCENTRAL_SEED_DATABASE_ACK: acme_test
      - run: npx playwright install --with-deps chromium
      - name: Browser journeys
        run: |
          npm run start > /tmp/acme-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then break; fi
            sleep 2
          done
          npm run test:e2e
